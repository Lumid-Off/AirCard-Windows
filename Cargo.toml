[package]
name = "aircard"
version = "0.1.0"
edition = "2024"
description = "Native Windows AirCard client"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
plist = "1"
regex = "1"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
