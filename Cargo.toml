[package]
name = "aircard"
version = "1.2.2"
edition = "2024"
description = "Native Windows AirCard client"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
native-tls = "0.2"
miniz_oxide = "0.8"
plist = "1"
regex = "1"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
